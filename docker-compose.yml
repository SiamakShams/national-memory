services:
  postgres:
    image: pgvector/pgvector:pg15
    container_name: face-postgres
    environment:
      POSTGRES_DB: facedb
      POSTGRES_USER: faceuser
      POSTGRES_PASSWORD: local_password
    ports:
      - "5432:5432"
    volumes:
      - ./storage/postgresql_data:/var/lib/postgresql/data
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped
    networks:
      - face-network

  # NEW: Web UI for managing the database
  pgadmin:
    image: dpage/pgadmin4
    container_name: face-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@memoryproject.org
      PGADMIN_DEFAULT_PASSWORD: admin_password
      # This allows pgAdmin to talk to the postgres container using its service name
      PGADMIN_CONFIG_SERVER_MODE: 'False' 
    ports:
      - "5050:80"
    networks:
      - face-network
    restart: unless-stopped

networks:
  face-network:
    driver: bridge